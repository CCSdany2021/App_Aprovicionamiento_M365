<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión M365</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=3.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #F4F6F8;
            background-image:
                radial-gradient(at 0% 0%, rgba(0, 135, 224, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 118, 196, 0.1) 0, transparent 50%);
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #DDE2E6;
            border-radius: 8px;
            padding: 3.5rem 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.6s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 3rem;
            color: #0087E0;
            margin-bottom: 1rem;
        }

        .login-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 400;
        }

        .login-header p {
            color: #747474;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #A9B7C6;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: #ffffff;
            border: 1px solid #DDE2E6;
            border-radius: 4px;
            color: #333;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-control::placeholder {
            color: #A9B7C6;
        }

        .form-control:focus {
            outline: none;
            border-color: #0087E0;
            box-shadow: 0 0 0 3px rgba(0, 135, 224, 0.1);
        }

        .form-control:focus+i {
            color: #0087E0;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: #0087E0;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            text-transform: uppercase;
        }

        .btn-login:hover {
            background: #0076c4;
            transform: translateY(-1px);
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 0.95rem;
            border: 1px solid transparent;
        }

        .background-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.4;
        }

        .setup-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem;
            background: #F4F6F8;
            color: #555;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid #DDE2E6;
        }

        .setup-link:hover {
            background: #E2E8F0;
            color: #333;
        }
    </style>
</head>

<body>

    <!-- Background Blobs -->
    <div class="background-blob"
        style="width: 700px; height: 700px; top: -200px; left: -100px; background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);">
    </div>
    <div class="background-blob"
        style="width: 600px; height: 600px; bottom: -150px; right: -50px; background: radial-gradient(circle, rgba(255, 191, 0, 0.15) 0%, transparent 70%); animation-delay: -7s;">
    </div>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-brands fa-microsoft"></i>
            <h2>Acceso Seguro</h2>
            <p>Plataforma de Aprovicionamiento M365</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <i class="fa-solid fa-user-tag"></i>
                <input type="text" name="username" class="form-control" placeholder="Usuario de acceso" required
                    autocomplete="off">
            </div>

            <div class="form-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">
                Entrar al Panel <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </form>

        <div style="margin-top: 2.5rem; border-top: 2px solid #f1f5f9; padding-top: 2rem; text-align: center;">
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.25rem; font-weight: 500;">¿Configurando una
                nueva instancia?</p>
            <a href="{{ url_for('setup', new=1) }}" class="setup-link">
                <i class="fa-solid fa-gear"></i> Configuración Inicial
            </a>
        </div>
    </div>

</body>

</html>
