<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión M365</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=2.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles-theme.css') }}?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f172a;
            /* Base dark */
            background-image:
                radial-gradient(at 0% 0%, rgba(21, 52, 89, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, rgba(21, 52, 89, 0.5) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(255, 191, 0, 0.15) 0, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.1) 0, transparent 50%);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        .login-card {
            background: rgba(21, 52, 89, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 3.5rem;
            color: #ffbf00;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px rgba(255, 191, 0, 0.3));
        }

        .login-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #fff;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 1.1rem 1rem 1.1rem 3.5rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #ffbf00;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(255, 191, 0, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #ffbf00, #ff9900);
            color: #153459;
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-login:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(255, 153, 0, 0.4);
        }

        .alert {
            padding: 1.1rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .background-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(5%, 5%) scale(1.1);
            }
        }
    </style>
</head>

<body>

    <!-- Background Blobs -->
    <div class="background-blob"
        style="width: 600px; height: 600px; top: -150px; left: -150px; background: radial-gradient(circle, rgba(21, 52, 89, 0.6) 0%, transparent 70%);">
    </div>
    <div class="background-blob"
        style="width: 500px; height: 500px; bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(255, 191, 0, 0.15) 0%, transparent 70%); animation-delay: -5s;">
    </div>
    <div class="background-blob"
        style="width: 400px; height: 400px; top: 40%; right: -50px; background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%); animation-delay: -10s;">
    </div>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-brands fa-microsoft"></i>
            <h2>Acceso Seguro</h2>
            <p>Gestión de Aprovicionamiento de Estudiantes M365</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required
                    autocomplete="off">
            </div>

            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn-login">
                Iniciar Sesión <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div
            style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; text-align: center;">
            <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 1rem;">¿Primera vez o nuevo
                colegio?</p>
            <a href="{{ url_for('setup', new=1) }}" class="btn-login"
                style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); margin-top: 0;">
                <i class="fa-solid fa-plus-circle"></i> Registrar Datos Nuevos
            </a>
        </div>
    </div>

</body>

</html>
